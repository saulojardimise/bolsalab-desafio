<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Organização · Desafio Carteira Recomendada 2027</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="estilo.css?v=202611270001">
<style>
main.gestor { max-width: 1240px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
@media (max-width: 899px) { main.gestor { grid-template-columns: 1fr; } }
.numeros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.numero { background: var(--cartao); border: 1px solid var(--linha); border-radius: 14px; padding: 12px 14px; }
.numero strong { display: block; font-size: 26px; color: var(--marinho); line-height: 1.1; }
.numero span { font-size: 13px; color: var(--suave); }
.numero.alerta strong { color: var(--ambar-texto); }
@media (max-width: 600px) { .numeros { grid-template-columns: 1fr 1fr; } }
.filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filtros input { flex: 1 1 260px; min-height: 44px; }
.filtros select { flex: 0 0 auto; width: auto; min-height: 44px; }
.equipe { display: grid; gap: 12px; }
.equipe-cabeca { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: start; }
.equipe-cabeca h2 { font-size: 18px; }
.equipe-acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.equipe-acoes .botao { min-height: 40px; padding: 0 14px; font-size: 14px; }
.tabela { width: 100%; border-collapse: collapse; font-size: 14px; }
.tabela th { text-align: left; font-size: 12px; color: var(--suave); font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--linha); }
.tabela td { padding: 8px; border-bottom: 1px solid var(--linha); vertical-align: middle; }
.tabela tr:last-child td { border-bottom: 0; }
.tabela .nome { font-weight: 700; color: var(--marinho); }
.tabela .acoes-comp { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.tabela .acoes-comp .botao { min-height: 32px; padding: 0 10px; font-size: 13px; }
.rolagem { overflow-x: auto; }
.faltam { font-size: 13px; color: var(--ambar-texto); }
.recusa { display: flex; gap: 8px; flex-wrap: wrap; }
.recusa input { flex: 1 1 220px; min-height: 40px; }
.lista-simples { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.lista-simples li { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.lateral { display: grid; gap: 16px; }
.inativa { color: var(--suave); }
.aluno-link { font: inherit; font-weight: 700; color: var(--marinho); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-decoration-color: var(--linha); text-underline-offset: 3px; }
.aluno-link:hover { color: var(--verde); text-decoration-color: currentColor; }
dialog.perfil { border: 0; border-radius: 18px; padding: 0; width: min(480px, calc(100vw - 32px)); background: var(--cartao); color: var(--texto); box-shadow: 0 20px 60px rgb(0 0 0 / .3); }
dialog.perfil::backdrop { background: rgb(6 35 68 / .55); }
.perfil-topo { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; padding: 20px 20px 12px; }
.perfil-topo .avatar { width: 64px; height: 64px; font-size: 22px; }
.perfil-topo h2 { margin: 0; font-size: 20px; color: var(--marinho); }
.perfil-fechar { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--fundo); color: var(--marinho); font-size: 20px; cursor: pointer; }
.perfil-corpo { padding: 0 20px 20px; display: grid; gap: 14px; }
.perfil-numeros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.perfil-numeros div { background: var(--fundo); border-radius: 12px; padding: 10px; }
.perfil-numeros strong { display: block; font-size: 18px; color: var(--marinho); }
.perfil-numeros span { font-size: 12px; color: var(--suave); }
.perfil-dados { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.perfil-dados dt { color: var(--suave); }
.perfil-dados dd { margin: 0; font-weight: 600; color: var(--marinho); overflow-wrap: anywhere; }
</style>
</head>
<body>
<header class="topo">
  <div class="topo-dentro">
    <div class="topo-linha">
      <a href="https://bolsalab.app/"><img src="../logo.svg" alt="BolsaLab" width="122" height="26"></a>
      <span id="topo-direita"></span>
    </div>
    <div class="topo-titulo"><h1>Desafio Carteira <em>Recomendada</em> 2027</h1>
    <p>Área da organização</p></div>
  </div>
</header>
<main id="tela" aria-live="polite"><p class="carregando">Carregando…</p></main>

<script src="supabase-2.118.0.js"></script>
<script src="olho.js?v=202611270001"></script>
<script>
// Área do professor: conferir comprovantes, aprovar ou recusar equipes, instituições e testadores.
// Tudo passa pelas funções do banco que exigem o gestor (_exigir_gestor); a página só mostra.
const sb = supabase.createClient('https://pvkhqfomfmhtdmvbzohq.supabase.co', 'sb_publishable_BfV3fJAiDJQMpwXkD8vZRw_EBL-Z95n');
const tela = document.getElementById('tela');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const msgErro = (e) => (e?.message || 'Algo deu errado.').replace(/^.*?ERROR:\s*/, '');
async function rpc(nome, args) { const { data, error } = await sb.rpc(nome, args); if (error) throw error; return data; }

let estado = { equipes: [], ies: [], testadores: [], situacao: null, filtro: 'conferir', busca: '', recado: '', recadoOk: false, recusando: null };

const SITUACAO = { formando: ['Em formação', 'selo-espera'], aprovada: ['Aprovada', 'selo-ok'], recusada: ['Recusada', 'selo-nao'] };
const COMPROVANTE = { pendente: ['Sem comprovante', 'selo-espera'], enviado: ['Para conferir', 'selo-espera'], aprovado: ['Aprovado', 'selo-ok'], recusado: ['Recusado', 'selo-nao'] };

async function carregar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.replace('./'); return; }   // o login é um só: na página de inscrição
  document.getElementById('topo-direita').innerHTML = '<a class="sair" href="./?participante" style="text-decoration:none">Ver como participante</a> <button class="sair" id="sair">Sair</button>';
  document.getElementById('sair').onclick = async () => { await sb.auth.signOut(); location.replace('./'); };
  try {
    const situacao = await rpc('desafio_situacao');
    if (!situacao?.gestor) {
      tela.className = 'estreito';
      tela.innerHTML = '<section class="cartao"><h2>Área só da organização</h2><p>Esta conta não é a do gestor. <a href="./">Ir para a inscrição</a>.</p></section>';
      return;
    }
    const [equipes, ies, testadores] = await Promise.all([
      rpc('desafio_gestor_equipes'),
      sb.from('desafio_ies').select('id, nome, sigla, ativa').order('nome').then((r) => r.data ?? []),
      rpc('desafio_gestor_testadores'),
    ]);
    const avisos = await rpc('desafio_gestor_avisos').catch(() => []);
    Object.assign(estado, { situacao, equipes: equipes ?? [], ies, testadores: testadores ?? [], avisos: avisos ?? [] });
  } catch (e) { estado.recado = msgErro(e); }
  desenhar();
}


// ---------------------------------------------------------------- situação de cada equipe
function analisar(e) {
  const m = e.integrantes ?? [];
  const faltas = [];
  if (m.length < 3) faltas.push(`faltam ${3 - m.length} integrante(s)`);
  const semComp = m.filter((x) => x.comprovante_situacao === 'pendente').length;
  if (semComp) faltas.push(`${semComp} sem comprovante`);
  const conferir = m.filter((x) => x.comprovante_situacao === 'enviado').length;
  if (conferir) faltas.push(`${conferir} comprovante(s) para conferir`);
  const recusados = m.filter((x) => x.comprovante_situacao === 'recusado').length;
  if (recusados) faltas.push(`${recusados} comprovante(s) recusado(s)`);
  const semCpf = m.filter((x) => !x.cpf).length;
  if (semCpf) faltas.push(`${semCpf} sem CPF`);
  const outraIes = m.filter((x) => !x.ies_ok).length;
  if (outraIes) faltas.push(`${outraIes} com instituição diferente ou não declarada`);
  return { faltas, conferir, pronta: e.situacao === 'formando' && faltas.length === 0 };
}

function filtradas() {
  const b = estado.busca.trim().toLowerCase(), bNum = b.replace(/\D/g, '');
  return estado.equipes.filter((e) => {
    const a = analisar(e);
    if (estado.filtro === 'conferir' && !(a.conferir || a.pronta)) return false;
    if (['formando', 'aprovada', 'recusada'].includes(estado.filtro) && e.situacao !== estado.filtro) return false;
    if (!b) return true;
    const texto = [e.nome, e.ies, e.codigo, ...(e.integrantes ?? []).flatMap((m) => [m.nome, m.email, m.curso])].join(' ').toLowerCase();
    return texto.includes(b) || (bNum.length >= 3 && (e.integrantes ?? []).some((m) => (m.cpf ?? '').replace(/\D/g, '').includes(bNum)));
  });
}

// ---------------------------------------------------------------- desenho
function desenhar() {
  const s = estado;
  tela.className = 'gestor';
  const todos = s.equipes.flatMap((e) => e.integrantes ?? []);
  const conferir = todos.filter((m) => m.comprovante_situacao === 'enviado').length;
  const prontas = s.equipes.filter((e) => analisar(e).pronta).length;
  const lista = filtradas();
  const recado = s.recado ? `<p class="${s.recadoOk ? 'ok' : 'erro'}" role="alert" style="grid-column:1/-1">${esc(s.recado)}</p>` : '';
  s.recado = ''; s.recadoOk = false;

  tela.innerHTML = recado + `<div style="display:grid;gap:16px;min-width:0">
    <div class="numeros">
      <div class="numero"><strong>${s.equipes.length}</strong><span>equipes</span></div>
      <div class="numero"><strong>${s.equipes.filter((e) => e.situacao === 'aprovada').length}</strong><span>aprovadas</span></div>
      <div class="numero"><strong>${todos.length}</strong><span>alunos inscritos</span></div>
      <div class="numero ${conferir + prontas ? 'alerta' : ''}"><strong>${conferir + prontas}</strong><span>esperando você</span></div>
    </div>
    <div class="filtros">
      <input type="search" id="busca" placeholder="Buscar equipe, aluno, e-mail, CPF ou instituição" value="${esc(s.busca)}">
      <select id="filtro" aria-label="Mostrar">
        ${[['conferir', 'Esperando você'], ['todas', 'Todas'], ['formando', 'Em formação'], ['aprovada', 'Aprovadas'], ['recusada', 'Recusadas']]
          .map(([v, t]) => `<option value="${v}" ${s.filtro === v ? 'selected' : ''}>${t}</option>`).join('')}
      </select>
    </div>
    ${lista.length ? lista.map(htmlEquipe).join('') : `<section class="cartao"><p class="suave">${s.filtro === 'conferir' ? 'Nada esperando você agora.' : 'Nenhuma equipe encontrada.'}</p></section>`}
  </div>
  <aside class="lateral">${htmlSituacao()}${htmlAvisosGestor()}${htmlIes()}${htmlTestadores()}</aside>`;
  ligar();
}

function htmlEquipe(e) {
  const [sit, sc] = SITUACAO[e.situacao] ?? [e.situacao, 'selo-espera'];
  const a = analisar(e);
  const membros = [...(e.integrantes ?? [])].sort((x, y) => y.lider - x.lider);
  return `<section class="cartao equipe">
    <div class="equipe-cabeca">
      <div><h2>${esc(e.nome)} <span class="selo ${sc}">${sit}</span></h2>
        <p class="suave">${esc(e.ies)} · ${membros.length} de 5 · criada em ${new Date(e.criada_em).toLocaleDateString('pt-BR')} · código ${esc(e.codigo)}</p>
        ${e.situacao === 'recusada' && e.motivo ? `<p class="faltam">Motivo: ${esc(e.motivo)}</p>` : ''}
        ${e.situacao === 'formando' && a.faltas.length ? `<p class="faltam">Falta: ${a.faltas.join(' · ')}</p>` : ''}
      </div>
      <div class="equipe-acoes">
        ${e.situacao !== 'aprovada' ? `<button class="botao botao-principal" data-aprovar="${e.id}" ${a.pronta ? '' : 'disabled title="A equipe ainda não cumpre todos os requisitos"'}>Aprovar equipe</button>` : ''}
        ${e.situacao !== 'recusada' ? `<button class="botao botao-perigo" data-recusar-equipe="${e.id}">Recusar</button>` : ''}
        ${e.situacao !== 'formando' ? `<button class="botao" data-reabrir="${e.id}">Voltar para formação</button>` : ''}
      </div>
    </div>
    ${estado.recusando === e.id ? `<form class="recusa" data-form-recusa="${e.id}">
      <input name="motivo" required minlength="5" placeholder="Motivo da recusa (a equipe vê)" autofocus>
      <button class="botao botao-perigo">Confirmar recusa</button>
      <button class="botao" type="button" data-cancelar-recusa>Cancelar</button>
    </form>` : ''}
    <div class="rolagem"><table class="tabela">
      <thead><tr><th>Aluno</th><th>CPF</th><th>Instituição declarada</th><th>Curso</th><th>Comprovante</th><th></th></tr></thead>
      <tbody>${membros.map((m) => {
        const [ct, cc] = COMPROVANTE[m.comprovante_situacao] ?? [m.comprovante_situacao, 'selo-espera'];
        return `<tr>
          <td><button class="aluno-link" data-perfil="${m.user_id}" data-equipe="${e.id}">${esc(m.nome || 'Sem nome')}</button>${m.lider ? ' <span class="selo-lider">Líder</span>' : ''}<div class="suave">${esc(m.email)}</div></td>
          <td style="white-space:nowrap">${m.cpf ? esc(m.cpf) : '<span class="faltam">falta</span>'}</td>
          <td>${m.ies_ok ? `<span class="selo selo-ok">${esc(m.ies_declarada)}</span>` : m.ies_declarada ? `<span class="selo selo-nao">${esc(m.ies_declarada)}</span>` : '<span class="faltam">não declarou</span>'}
            ${htmlNoApp(m, e)}</td>
          <td>${esc(m.curso)}<div class="suave">${esc(m.periodo)} período</div></td>
          <td><span class="selo ${cc}">${ct}</span></td>
          <td><div class="acoes-comp">
            ${m.comprovante ? `<button class="botao" data-ver="${esc(m.comprovante)}">Ver</button>` : ''}
            ${m.comprovante && m.comprovante_situacao !== 'aprovado' ? `<button class="botao" data-comp="${m.user_id}" data-sit="aprovado">Aprovar</button>` : ''}
            ${m.comprovante && m.comprovante_situacao !== 'recusado' ? `<button class="botao botao-perigo" data-comp="${m.user_id}" data-sit="recusado">Recusar</button>` : ''}
          </div></td>
        </tr>`; }).join('')}</tbody>
    </table></div>
  </section>`;
}

function htmlSituacao() {
  const s = estado.situacao;
  const fim = new Date(s.inscricoes_fim).toLocaleDateString('pt-BR'), ini = new Date(s.inscricoes_inicio).toLocaleDateString('pt-BR');
  return `<section class="cartao">
    <h2>Situação</h2>
    <p>${s.liberado ? '<span class="selo selo-ok">Desafio liberado</span>' : '<span class="selo selo-espera">Fechado: só testadores</span>'}</p>
    <p class="suave">Inscrições de ${ini} a ${fim}${s.inscricoes_abertas ? ' (abertas agora)' : ''}.</p>
    <p class="suave">Para liberar para todos, rode no SQL Editor: <code>select desafio_gestor_liberar(true);</code></p>
  </section>`;
}
function htmlAvisosGestor() {
  return `<section class="cartao">
    <h2>Avisos</h2>
    <form id="novo-aviso" style="display:grid;gap:8px">
      <input name="titulo" required maxlength="120" placeholder="Título">
      <textarea name="texto" required rows="3" maxlength="4000" placeholder="Aviso para as equipes"></textarea>
      <select name="equipe" aria-label="Para quem"><option value="">Todas as equipes</option>
        ${estado.equipes.map((e) => `<option value="${e.id}">Só ${esc(e.nome)}</option>`).join('')}</select>
      <button class="botao botao-principal">Publicar aviso</button>
    </form>
    <ul class="lista-simples">${(estado.avisos ?? []).map((a) => `<li><span><strong>${esc(a.titulo)}</strong><br><span class="suave">${new Date(a.criado_em).toLocaleDateString('pt-BR')} · ${a.equipe ? 'só ' + esc(a.equipe) : 'todas'}</span></span>
      <button class="botao-link botao-perigo" data-apagar-aviso="${a.id}">Apagar</button></li>`).join('')}</ul>
  </section>`;
}
function htmlIes() {
  return `<section class="cartao">
    <h2>Instituições</h2>
    <p class="suave">A mesma lista do app. Só as marcadas "no desafio" aparecem na inscrição.</p>
    <ul class="lista-simples">${estado.ies.map((i) => `<li><span class="${i.ativa ? '' : 'inativa'}">${esc(i.nome)}${i.sigla ? ` (${esc(i.sigla)})` : ''}</span>
      <button class="botao-link ${i.ativa ? 'botao-perigo' : ''}" data-ies="${i.id}" data-ativa="${!i.ativa}">${i.ativa ? 'Tirar do desafio' : 'Pôr no desafio'}</button></li>`).join('') || '<li class="suave">Nenhuma cadastrada.</li>'}</ul>
    <form id="nova-ies" style="display:grid;gap:8px">
      <input name="nome" required placeholder="Nome da instituição">
      <div style="display:flex;gap:8px"><input name="sigla" placeholder="Sigla" style="flex:1"><button class="botao">Adicionar</button></div>
    </form>
  </section>`;
}
function htmlTestadores() {
  return `<section class="cartao">
    <h2>Testadores</h2>
    <p class="suave">Com o desafio fechado, só estes e-mails conseguem se inscrever.</p>
    <ul class="lista-simples">${estado.testadores.map((t) => `<li><span>${esc(t.email)}${t.tem_conta ? '' : ' <span class="faltam">(sem conta)</span>'}</span>
      <button class="botao-link botao-perigo" data-tirar="${esc(t.email)}">Tirar</button></li>`).join('') || '<li class="suave">Nenhum.</li>'}</ul>
    <form id="novo-testador" style="display:flex;gap:8px"><input name="email" type="email" required placeholder="e-mail" style="flex:1"><button class="botao">Incluir</button></form>
  </section>`;
}

// a universidade do perfil do app parece a mesma da equipe? (texto livre: compara sem acento e maiúsculas)
const normal = (t) => String(t ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
function bateIes(perfil, e) {
  const p = normal(perfil), alvo = [normal(e.ies), normal(e.ies_sigla)].filter(Boolean);
  return !p || alvo.some((a) => a === p || a.split(' ').includes(p) || a.includes(p) || p.includes(a));
}

// a instituição do perfil do app: pelo id (060); sem id, pelo texto
function htmlNoApp(m, e) {
  if (!m.universidade_perfil && !m.perfil_ies) return '<div class="suave">no app: não informou</div>';
  const ok = m.perfil_ies_ok ?? (m.perfil_ies === undefined ? bateIes(m.universidade_perfil, e) : false);
  const nome = m.perfil_ies || m.universidade_perfil;
  const fora = m.perfil_ies === null && m.universidade_perfil ? ' (fora da lista)' : '';
  return `<div class="${ok ? 'suave' : 'faltam'}" title="Instituição do perfil do app BolsaLab (não é a declaração do desafio)">no app: ${esc(nome)}${fora}${ok ? '' : ' ⚠ diferente'}</div>`;
}

// ---------------------------------------------------------------- perfil do aluno
const pct = (v) => v == null ? '–' : `${v > 0 ? '+' : ''}${Number(v).toFixed(2).replace('.', ',')}%`;
async function abrirPerfil(userId, equipeId) {
  const equipe = estado.equipes.find((e) => e.id === equipeId);
  const m = (equipe?.integrantes ?? []).find((x) => x.user_id === userId) ?? {};
  const d = document.createElement('dialog');
  d.className = 'perfil';
  d.setAttribute('aria-labelledby', 'perfil-nome');
  d.innerHTML = '<p class="carregando">Carregando…</p>';
  document.body.append(d);
  d.addEventListener('close', () => d.remove());
  d.addEventListener('click', (ev) => { if (ev.target === d) d.close(); });
  d.showModal();
  let p = {};
  try { p = await rpc('perfil_publico', { p_user: userId }); } catch (e) { p = { erro: msgErro(e) }; }
  const iniciais = esc((m.nome || '?').split(' ').map((x) => x[0]).slice(0, 2).join('').toUpperCase());
  const criado = p.criado_em ? new Date(p.criado_em).toLocaleDateString('pt-BR') : '–';
  d.innerHTML = `<div class="perfil-topo">
      <span class="avatar">${p.foto_url ? `<img src="${esc(p.foto_url)}" alt="">` : iniciais}</span>
      <div><h2 id="perfil-nome">${esc(p.nome || m.nome || 'Sem nome')}</h2>
        <p class="suave">${esc(equipe?.nome ?? '')}${m.lider ? ' · líder' : ''}</p></div>
      <button class="perfil-fechar" aria-label="Fechar">×</button>
    </div>
    <div class="perfil-corpo">
      ${p.erro ? `<p class="erro">${esc(p.erro)}</p>` : `<div class="perfil-numeros">
        <div><strong>${p.posicao ? `${p.posicao}º` : '–'}</strong><span>no ranking${p.participantes ? ` de ${p.participantes}` : ''}</span></div>
        <div><strong>${pct(p.rentabilidade_pct)}</strong><span>rentabilidade</span></div>
        <div><strong>${p.operacoes ?? 0}</strong><span>operações</span></div>
      </div>`}
      <dl class="perfil-dados">
        <dt>E-mail</dt><dd>${esc(m.email)}</dd>
        <dt>CPF</dt><dd>${esc(m.cpf || 'não informado')}</dd>
        <dt>Desafio</dt><dd>${esc(m.curso)} · ${esc(m.periodo)} período · ${esc(m.ies_declarada || 'instituição não declarada')}</dd>
        <dt>Perfil BolsaLab</dt><dd>${esc([p.curso, p.universidade].filter(Boolean).join(' · ') || 'sem curso e universidade')}</dd>
        <dt>Conta desde</dt><dd>${criado}</dd>
        <dt>Grupos</dt><dd>${esc((p.grupos ?? []).join(', ') || 'nenhum')}</dd>
        <dt>Mais negociado</dt><dd>${p.favorito ? `${esc(p.favorito.ativo)} (${p.favorito.ordens} ordens)` : '–'}</dd>
      </dl>
    </div>`;
  d.querySelector('.perfil-fechar').onclick = () => d.close();
}

// ---------------------------------------------------------------- ações
async function acao(fazer, sucesso) {
  tela.querySelectorAll('button').forEach((b) => (b.disabled = true));
  try { await fazer(); estado.recado = sucesso; estado.recadoOk = true; }
  catch (e) { estado.recado = msgErro(e); }
  await carregar();
}
function ligar() {
  tela.querySelectorAll('[data-perfil]').forEach((b) => b.onclick = () => abrirPerfil(b.dataset.perfil, Number(b.dataset.equipe)));
  const busca = document.getElementById('busca');
  busca.oninput = () => { estado.busca = busca.value; const pos = busca.selectionStart; desenhar(); const n = document.getElementById('busca'); n.focus(); n.setSelectionRange(pos, pos); };
  document.getElementById('filtro').onchange = (ev) => { estado.filtro = ev.target.value; desenhar(); };
  tela.querySelectorAll('[data-ver]').forEach((b) => b.onclick = async () => {
    const janela = window.open('', '_blank');
    const { data, error } = await sb.storage.from('desafio-comprovantes').createSignedUrl(b.dataset.ver, 300);
    if (error) { janela?.close(); estado.recado = 'Não consegui abrir o comprovante: ' + msgErro(error); return desenhar(); }
    if (janela) janela.location = data.signedUrl; else location.href = data.signedUrl;
  });
  tela.querySelectorAll('[data-comp]').forEach((b) => b.onclick = () =>
    acao(() => rpc('desafio_gestor_comprovante', { p_user_id: b.dataset.comp, p_situacao: b.dataset.sit }), b.dataset.sit === 'aprovado' ? 'Comprovante aprovado.' : 'Comprovante recusado. O aluno pode enviar outro.'));
  tela.querySelectorAll('[data-aprovar]').forEach((b) => b.onclick = () =>
    acao(() => rpc('desafio_gestor_situacao_equipe', { p_equipe_id: Number(b.dataset.aprovar), p_situacao: 'aprovada' }), 'Equipe aprovada.'));
  tela.querySelectorAll('[data-reabrir]').forEach((b) => b.onclick = () =>
    acao(() => rpc('desafio_gestor_situacao_equipe', { p_equipe_id: Number(b.dataset.reabrir), p_situacao: 'formando' }), 'Equipe voltou para formação.'));
  tela.querySelectorAll('[data-recusar-equipe]').forEach((b) => b.onclick = () => { estado.recusando = Number(b.dataset.recusarEquipe); desenhar(); });
  tela.querySelector('[data-cancelar-recusa]')?.addEventListener('click', () => { estado.recusando = null; desenhar(); });
  tela.querySelectorAll('[data-form-recusa]').forEach((f) => f.onsubmit = (ev) => {
    ev.preventDefault();
    const id = Number(f.dataset.formRecusa), motivo = new FormData(f).get('motivo');
    estado.recusando = null;
    acao(() => rpc('desafio_gestor_situacao_equipe', { p_equipe_id: id, p_situacao: 'recusada', p_motivo: motivo }), 'Equipe recusada.');
  });
  tela.querySelectorAll('[data-ies]').forEach((b) => b.onclick = () =>
    acao(() => rpc('desafio_gestor_ies_ativa', { p_id: Number(b.dataset.ies), p_ativa: b.dataset.ativa === 'true' }), 'Instituição atualizada.'));
  document.getElementById('novo-aviso').onsubmit = (ev) => {
    ev.preventDefault(); const f = new FormData(ev.target);
    acao(() => rpc('desafio_gestor_aviso', { p_titulo: f.get('titulo'), p_texto: f.get('texto'), p_equipe_id: Number(f.get('equipe')) || null }), 'Aviso publicado.');
  };
  tela.querySelectorAll('[data-apagar-aviso]').forEach((b) => b.onclick = () => {
    if (!b.dataset.confirmar) { b.dataset.confirmar = '1'; b.textContent = 'Apagar mesmo?'; return; }
    acao(() => rpc('desafio_gestor_apagar_aviso', { p_id: Number(b.dataset.apagarAviso) }), 'Aviso apagado.');
  });
  document.getElementById('nova-ies').onsubmit = (ev) => {
    ev.preventDefault(); const f = new FormData(ev.target);
    acao(() => rpc('desafio_gestor_ies', { p_nome: f.get('nome'), p_sigla: f.get('sigla') }), 'Instituição no desafio (se já existia pela sigla ou nome, foi só ativada).');
  };
  tela.querySelectorAll('[data-tirar]').forEach((b) => b.onclick = () =>
    acao(() => rpc('desafio_gestor_testador', { p_email: b.dataset.tirar, p_incluir: false }), 'Testador retirado.'));
  document.getElementById('novo-testador').onsubmit = (ev) => {
    ev.preventDefault(); const f = new FormData(ev.target);
    acao(() => rpc('desafio_gestor_testador', { p_email: f.get('email'), p_incluir: true }), 'Testador incluído.');
  };
}

carregar();
</script>
